<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PALBON SUITES — Intelligent Business Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #eef5fc;
      font-family: 'Inter', system-ui, sans-serif;
      color: #1e293b;
    }

    #root {
      width: 100%; height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    /* ── Page Nav ── */
    .page-nav {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 100;
      display: flex; align-items: center; gap: 4px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(203, 213, 225, 0.6);
      border-radius: 40px;
      padding: 5px 8px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(148, 163, 184, 0.2);
    }
    .page-nav a {
      text-decoration: none;
      font-size: 11px; font-weight: 600; letter-spacing: 1.5px;
      padding: 7px 18px; border-radius: 30px;
      color: #64748b;
      transition: all 0.25s ease;
    }
    .page-nav a:hover { color: #0f172a; }
    .page-nav a.active {
      background: rgba(14, 165, 233, 0.12);
      color: #0284c7;
      border: 1px solid rgba(14, 165, 233, 0.3);
    }

    /* ── Header ── */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      height: 64px;
      padding: 0 32px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(248, 250, 252, 0.85);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 800; color: #fff;
      box-shadow: 0 4px 16px rgba(14,165,233,0.35);
    }
    .brand-info { display: flex; flex-direction: column; }
    .brand-name { font-size: 17px; font-weight: 800; letter-spacing: 2px; color: #0f172a; }
    .brand-tagline { font-size: 10px; color: #64748b; letter-spacing: 1.5px; font-weight: 600; }

    .header-pills { display: flex; gap: 6px; }
    .pill {
      font-size: 10px; font-weight: 600; letter-spacing: 1px;
      padding: 4px 12px; border-radius: 20px;
      border: 1px solid rgba(203, 213, 225, 0.8);
      color: #475569;
      background: rgba(255, 255, 255, 0.7);
    }

    /* ── Footer ── */
    .footer {
      position: fixed; bottom: 20px; left: 0; right: 0;
      text-align: center; z-index: 50;
      font-size: 10px; letter-spacing: 3px;
      color: #64748b;
      font-weight: 700;
      text-transform: uppercase;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Page Navigation -->
  <nav class="page-nav">
    <a href="/index.html">Intelligence Flow Engine</a>
    <a href="/palbon.html" class="active">PALBON Suites</a>
  </nav>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-logo">P</div>
      <div class="brand-info">
        <span class="brand-name">PALBON</span>
        <span class="brand-tagline">INTELLIGENT BUSINESS PLATFORM</span>
      </div>
    </div>
    <div class="header-pills">
      <span class="pill">HRMS</span>
      <span class="pill">ERP</span>
      <span class="pill">LXP</span>
      <span class="pill">CRM</span>
      <span class="pill">Analytics & AI</span>
      <span class="pill">Operations</span>
    </div>
  </header>

  <!-- 3D Canvas root -->
  <div id="root"></div>

  <!-- Footer -->
  <div class="footer">Trusted by Forward-Thinking Organizations</div>

  <script type="module" src="/palbon.js"></script>
</body>
</html>
